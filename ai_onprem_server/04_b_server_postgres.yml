version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: Inlogic@123
      POSTGRES_DB: inlogicai_public

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminuser -d inlogicai_public"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - shared_network

volumes:
  postgres_data:

networks:
  shared_network:
    external: true