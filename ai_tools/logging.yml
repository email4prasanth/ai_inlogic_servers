services:
  loki:
    image: grafana/loki:3.7.6
    container_name: loki
    restart: unless-stopped
    ports:
      - "${TOOLS_BIND_ADDRESS:-127.0.0.1}:7004:3100"
    command:
      - -config.file=/etc/loki/loki.yml
      - -target=all
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - monitoring_network

volumes:
  loki_data:

networks:
  monitoring_network:
