version: '3.8'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "7000:9000"   # Portainer Web UI (mapped to 7000)
      - "9443:9443"   # Portainer HTTPS (optional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - shared_network

volumes:
  portainer_data:

networks:
  shared_network:
    external: true