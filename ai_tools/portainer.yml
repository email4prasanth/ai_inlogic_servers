name: portainer

services:
  portainer:
    image: portainer/portainer-ce:2.39.5
    container_name: portainer
    restart: unless-stopped
    ports:
      # HTTPS UI. Keep the bind address private unless protected by a firewall/VPN.
      - "${TOOLS_BIND_ADDRESS:-127.0.0.1}:7000:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
