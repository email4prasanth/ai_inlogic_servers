global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'prometheus'

  - job_name: 'database_service'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['database_service:6000']
        labels:
          environment: 'production'
          service: 'database_service'

  - job_name: 'node_exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: 'production'
          service: 'node_exporter'

  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          environment: 'production'
          service: 'cadvisor'