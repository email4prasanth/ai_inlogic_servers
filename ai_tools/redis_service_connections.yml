# CCD-specific wrapper around redis_pipeline_template.yml.
# Add this step after the service .env generation step and before SCP/deployment.
# Both templates must be copied into the same templates directory.
#
# Usage from service-deployment.yml:
#
# - template: redis_service_connections.yml
#   parameters:
#     serviceName: ${{ parameters.serviceName }}
#     envFile: .env.${{ parameters.serviceName }}
#     redisHost: $(BACKEND_VM_HOST)

parameters:
- name: serviceName
  type: string

- name: envFile
  type: string

- name: redisHost
  type: string

- name: redisPort
  type: number
  default: 7003

- name: keyVaultName
  type: string
  default: $(KEY_VAULT_NAME)

- name: passwordSecretName
  type: string
  default: redis-password

steps:
- ${{ if eq(parameters.serviceName, 'ccd-auth-service') }}:
  - template: redis_pipeline_template.yml
    parameters:
      envFile: ${{ parameters.envFile }}
      redisHost: ${{ parameters.redisHost }}
      redisPort: ${{ parameters.redisPort }}
      keyVaultName: ${{ parameters.keyVaultName }}
      passwordSecretName: ${{ parameters.passwordSecretName }}
      connections:
      - name: REFRESH_REDIS_URL
        database: 2

- ${{ if eq(parameters.serviceName, 'ccd-investigation-service') }}:
  - template: redis_pipeline_template.yml
    parameters:
      envFile: ${{ parameters.envFile }}
      redisHost: ${{ parameters.redisHost }}
      redisPort: ${{ parameters.redisPort }}
      keyVaultName: ${{ parameters.keyVaultName }}
      passwordSecretName: ${{ parameters.passwordSecretName }}
      connections:
      - name: CELERY_BROKER_URL
        database: 0
      - name: CELERY_RESULT_BACKEND
        database: 1

- ${{ if eq(parameters.serviceName, 'ccd-agent-worker') }}:
  - template: redis_pipeline_template.yml
    parameters:
      envFile: ${{ parameters.envFile }}
      redisHost: ${{ parameters.redisHost }}
      redisPort: ${{ parameters.redisPort }}
      keyVaultName: ${{ parameters.keyVaultName }}
      passwordSecretName: ${{ parameters.passwordSecretName }}
      connections:
      - name: CELERY_BROKER_URL
        database: 0
      - name: CELERY_RESULT_BACKEND
        database: 1

- ${{ if eq(parameters.serviceName, 'ccd-api-gateway') }}:
  - template: redis_pipeline_template.yml
    parameters:
      envFile: ${{ parameters.envFile }}
      redisHost: ${{ parameters.redisHost }}
      redisPort: ${{ parameters.redisPort }}
      keyVaultName: ${{ parameters.keyVaultName }}
      passwordSecretName: ${{ parameters.passwordSecretName }}
      connections:
      - name: RATE_LIMIT_REDIS_URL
        database: 3

- ${{ if not(or(eq(parameters.serviceName, 'ccd-auth-service'), eq(parameters.serviceName, 'ccd-investigation-service'), eq(parameters.serviceName, 'ccd-agent-worker'), eq(parameters.serviceName, 'ccd-api-gateway'))) }}:
  - bash: |
      echo "##vso[task.logissue type=error]No Redis connection mapping exists for service: $SERVICE_NAME"
      exit 1
    displayName: Reject unknown Redis service mapping
    env:
      SERVICE_NAME: ${{ parameters.serviceName }}
