name: remote-tools

services:
  portainer-agent:
    image: portainer/agent:2.39.5
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "${REMOTE_BIND_ADDRESS:?Set REMOTE_BIND_ADDRESS in .env}:9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.11.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    ports:
      - "${REMOTE_BIND_ADDRESS:?Set REMOTE_BIND_ADDRESS in .env}:7100:9100"
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
    ports:
      - "${REMOTE_BIND_ADDRESS:?Set REMOTE_BIND_ADDRESS in .env}:7101:8080"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      SERVER_NAME: "${SERVER_NAME:?Set SERVER_NAME in .env}"
      LOKI_PUSH_URL: "${LOKI_PUSH_URL:-http://192.168.3.52:7004/loki/api/v1/push}"
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
